<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Details - KenyaHouses</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        .property-detail {
            padding: 100px 0 60px;
        }
        .detail-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
            font-weight: 500;
            margin-bottom: 25px;
            transition: var(--transition);
        }
        .back-link:hover {
            gap: 12px;
        }
        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }
        .detail-title {
            font-size: 2rem;
            color: var(--dark);
            margin-bottom: 8px;
        }
        .detail-location {
            color: var(--gray);
            font-size: 1.1rem;
        }
        .detail-location i {
            color: var(--primary);
            margin-right: 5px;
        }
        .detail-price {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
        }
        .detail-price span {
            font-size: 1rem;
            font-weight: 400;
            color: var(--gray);
        }
        .detail-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .gallery {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
            margin-bottom: 40px;
            border-radius: var(--radius);
            overflow: hidden;
        }
        .gallery-main {
            height: 500px;
            overflow: hidden;
        }
        .gallery-main img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .gallery-thumbs {
            display: grid;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
        }
        .gallery-thumbs img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .gallery-thumbs img:hover {
            opacity: 0.8;
        }
        .detail-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 40px;
        }
        .detail-features {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .feature-box {
            text-align: center;
            padding: 20px;
            background: var(--light-gray);
            border-radius: var(--radius);
        }
        .feature-box i {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 10px;
        }
        .feature-box .value {
            display: block;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--dark);
        }
        .feature-box .label {
            font-size: 0.9rem;
            color: var(--gray);
        }
        .detail-description {
            margin-bottom: 30px;
        }
        .detail-description h3 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: var(--dark);
        }
        .detail-description p {
            color: #555;
            line-height: 1.8;
        }
        .detail-sidebar {
            position: sticky;
            top: 100px;
        }
        .contact-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: var(--shadow);
        }
        .contact-card h3 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: var(--dark);
        }
        .agent-info {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .agent-avatar {
            width: 60px;
            height: 60px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 1.5rem;
        }
        .agent-name {
            font-weight: 600;
            color: var(--dark);
        }
        .agent-role {
            font-size: 0.9rem;
            color: var(--gray);
        }
        #detail-map {
            height: 250px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .detail-contact-form {
            margin-top: 20px;
        }
        .detail-contact-form .form-group {
            margin-bottom: 15px;
        }
        .detail-contact-form input,
        .detail-contact-form textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
        }
        .detail-contact-form input:focus,
        .detail-contact-form textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        .detail-contact-form textarea {
            resize: vertical;
            min-height: 100px;
        }
        .share-links {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .share-links a {
            width: 40px;
            height: 40px;
            background: var(--light-gray);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .share-links a:hover {
            background: var(--primary);
            color: var(--white);
        }
        @media (max-width: 992px) {
            .gallery {
                grid-template-columns: 1fr;
            }
            .gallery-main {
                height: 350px;
            }
            .detail-grid {
                grid-template-columns: 1fr;
            }
            .detail-features {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 576px) {
            .detail-header {
                flex-direction: column;
            }
            .detail-price {
                font-size: 2rem;
            }
            .gallery-main {
                height: 280px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">
                <i class="fas fa-home"></i> KenyaHouses
            </a>
            <nav class="nav">
                <a href="index.html" class="nav-link">Home</a>
                <a href="index.html#listings" class="nav-link">Listings</a>
                <a href="index.html#map-section" class="nav-link">Map</a>
                <a href="index.html#contact" class="nav-link">Contact</a>
            </nav>
            <button class="mobile-menu-btn" id="mobileMenuBtn">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </header>

    <!-- Property Detail -->
    <section class="property-detail">
        <div class="detail-container">
            <a href="index.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Listings
            </a>

            <div class="detail-header">
                <div>
                    <h1 class="detail-title" id="detailTitle">Loading...</h1>
                    <p class="detail-location" id="detailLocation">
                        <i class="fas fa-map-marker-alt"></i> <span></span>
                    </p>
                </div>
                <div>
                    <div class="detail-price" id="detailPrice"></div>
                    <div class="detail-actions">
                        <button class="btn-primary" id="inquireBtn">
                            <i class="fas fa-envelope"></i> Inquire Now
                        </button>
                        <button class="btn-outline" onclick="window.print()">
                            <i class="fas fa-print"></i> Print
                        </button>
                    </div>
                </div>
            </div>

            <!-- Gallery -->
            <div class="gallery">
                <div class="gallery-main">
                    <img id="galleryMain" src="" alt="Property">
                </div>
                <div class="gallery-thumbs" id="galleryThumbs">
                </div>
            </div>

            <div class="detail-grid">
                <div class="detail-main">
                    <!-- Features -->
                    <div class="detail-features" id="detailFeatures">
                    </div>

                    <!-- Description -->
                    <div class="detail-description">
                        <h3>About This Property</h3>
                        <p id="detailDescription"></p>
                    </div>

                    <!-- Map -->
                    <div class="detail-description">
                        <h3>Location</h3>
                        <div id="detail-map"></div>
                    </div>
                </div>

                <!-- Sidebar -->
                <div class="detail-sidebar">
                    <div class="contact-card">
                        <h3>Contact Agent</h3>
                        <div class="agent-info">
                            <div class="agent-avatar">
                                <i class="fas fa-user"></i>
                            </div>
                            <div>
                                <div class="agent-name">David Mwangi</div>
                                <div class="agent-role">Senior Property Consultant</div>
                            </div>
                        </div>
                        <div class="detail-contact-form">
                            <input type="text" placeholder="Your Name" id="agentName">
                            <input type="email" placeholder="Your Email" id="agentEmail">
                            <input type="tel" placeholder="Your Phone" id="agentPhone">
                            <textarea placeholder="I'm interested in this property..." id="agentMessage"></textarea>
                            <button class="btn-primary btn-full" id="agentSendBtn">
                                <i class="fas fa-paper-plane"></i> Send Message
                            </button>
                        </div>
                        <div class="share-links">
                            <a href="#" title="Share on Facebook"><i class="fab fa-facebook-f"></i></a>
                            <a href="#" title="Share on Twitter"><i class="fab fa-twitter"></i></a>
                            <a href="#" title="Share on WhatsApp"><i class="fab fa-whatsapp"></i></a>
                            <a href="#" title="Copy Link"><i class="fas fa-link"></i></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 KenyaHouses. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Get property from localStorage
        const property = JSON.parse(localStorage.getItem('selectedProperty'));

        if (property) {
            document.title = `${property.title} - KenyaHouses`;
            document.getElementById('detailTitle').textContent = property.title;
            document.getElementById('detailLocation').querySelector('span').textContent = property.location;
            document.getElementById('galleryMain').src = property.images[0];
            document.getElementById('detailDescription').textContent = property.description;

            // Price
            const priceEl = document.getElementById('detailPrice');
            if (property.purpose === 'rent') {
                priceEl.innerHTML = `KES ${property.price.toLocaleString()}<span>/month</span>`;
            } else {
                priceEl.innerHTML = `KES ${property.price.toLocaleString()}`;
            }

            // Features
            document.getElementById('detailFeatures').innerHTML = `
                <div class="feature-box">
                    <i class="fas fa-bed"></i>
                    <span class="value">${property.bedrooms}</span>
                    <span class="label">Bedrooms</span>
                </div>
                <div class="feature-box">
                    <i class="fas fa-bath"></i>
                    <span class="value">${property.bathrooms}</span>
                    <span class="label">Bathrooms</span>
                </div>
                <div class="feature-box">
                    <i class="fas fa-ruler-combined"></i>
                    <span class="value">${property.area}</span>
                    <span class="label">Square Meters</span>
                </div>
                <div class="feature-box">
                    <i class="fas fa-home"></i>
                    <span class="value">${property.type}</span>
                    <span class="label">Property Type</span>
                </div>
            `;

            // Gallery thumbs
            const thumbsContainer = document.getElementById('galleryThumbs');
            property.images.forEach((img, index) => {
                const thumb = document.createElement('img');
                thumb.src = img;
                thumb.alt = `View ${index + 1}`;
                thumb.addEventListener('click', () => {
                    document.getElementById('galleryMain').src = img;
                });
                thumbsContainer.appendChild(thumb);
            });

            // Map
            const detailMap = L.map('detail-map').setView([property.lat, property.lng], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(detailMap);
            L.marker([property.lat, property.lng]).addTo(detailMap)
                .bindPopup(property.title)
                .openPopup();

            // Inquire button
            document.getElementById('inquireBtn').addEventListener('click', () => {
                document.getElementById('agentMessage').focus();
            });

            // Agent send
            document.getElementById('agentSendBtn').addEventListener('click', () => {
                const name = document.getElementById('agentName').value;
                const email = document.getElementById('agentEmail').value;
                const message = document.getElementById('agentMessage').value;
                if (name && email && message) {
                    alert('Thank you! Your message has been sent. We will contact you shortly.');
                    document.getElementById('agentName').value = '';
                    document.getElementById('agentEmail').value = '';
                    document.getElementById('agentPhone').value = '';
                    document.getElementById('agentMessage').value = '';
                } else {
                    alert('Please fill in all required fields.');
                }
            });
        } else {
            window.location.href = 'index.html';
        }

        // Mobile menu
        document.getElementById('mobileMenuBtn').addEventListener('click', () => {
            document.querySelector('.nav').classList.toggle('active');
        });
    </script>
</body>
</html>
