{% extends "base.html" %}

{% block title %}Admin Login - KenyaHouses{% endblock %}

{% block content %}
<section class="login-section">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-user-shield"></i>
                <h2>Admin Login</h2>
                <p>Access the property management dashboard</p>
            </div>
            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn-primary btn-full">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>
        </div>
    </div>
</section>

<style>
.login-section {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(26,127,55,0.9), rgba(26,26,46,0.85)),
                url('https://images.unsplash.com/photo-1564013799919-ab600027ffc6?w=1920') center/cover;
    padding: 100px 20px 60px;
}
.login-card {
    background: white;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 400px;
}
.login-header {
    text-align: center;
    margin-bottom: 30px;
}
.login-header i {
    font-size: 3rem;
    color: #1a7f37;
    margin-bottom: 15px;
}
.login-header h2 {
    font-size: 1.8rem;
    color: #1a1a2e;
    margin-bottom: 5px;
}
.login-header p {
    color: #6c757d;
}
</style>
{% endblock %}
