{% extends "base.html" %}

{% block title %}Add Property - KenyaHouses{% endblock %}

{% block content %}
<section class="form-section">
    <div class="container">
        <div class="form-container">
            <div class="form-header">
                <a href="{{ url_for('dashboard') }}" class="back-link">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
                <h1>Add New Property</h1>
            </div>
            
            <form method="POST" action="{{ url_for('add_property') }}" enctype="multipart/form-data">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Property Title *</label>
                        <input type="text" name="title" placeholder="Modern 4-Bedroom Villa" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Location *</label>
                        <input type="text" name="location" placeholder="Karen, Nairobi" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Location Key *</label>
                        <select name="locationKey" required>
                            <option value="nairobi">Nairobi</option>
                            <option value="mombasa">Mombasa</option>
                            <option value="kisumu">Kisumu</option>
                            <option value="nakuru">Nakuru</option>
                            <option value="eldoret">Eldoret</option>
                            <option value="thika">Thika</option>
                            <option value="malindi">Malindi</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Property Type *</label>
                        <select name="type" required>
                            <option value="house">House</option>
                            <option value="apartment">Apartment</option>
                            <option value="villa">Villa</option>
                            <option value="townhouse">Townhouse</option>
                            <option value="land">Land</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Purpose *</label>
                        <select name="purpose" required>
                            <option value="sale">For Sale</option>
                            <option value="rent">For Rent</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Price (KES) *</label>
                        <input type="number" name="price" placeholder="15000000" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Bedrooms *</label>
                        <input type="number" name="bedrooms" placeholder="4" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Bathrooms *</label>
                        <input type="number" name="bathrooms" placeholder="3" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Area (sqm) *</label>
                        <input type="number" name="area" placeholder="350" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Latitude</label>
                        <input type="number" step="any" name="lat" placeholder="-1.2921" value="-1.2921">
                    </div>
                    
                    <div class="form-group">
                        <label>Longitude</label>
                        <input type="number" step="any" name="lng" placeholder="36.8219" value="36.8219">
                    </div>
                </div>
                
                <div class="form-group full-width">
                    <label>Description *</label>
                    <textarea name="description" rows="4" placeholder="Describe the property features..." required></textarea>
                </div>
                
                <div class="form-group full-width">
                    <label>Property Images</label>
                    <input type="file" name="images" multiple accept="image/*" class="file-input">
                    <p class="help-text">Select multiple images. First image will be the main image.</p>
                </div>
                
                <div class="form-divider">
                    <h3>Contact Information</h3>
                </div>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>Contact Name</label>
                        <input type="text" name="contact_name" placeholder="Your name">
                    </div>
                    
                    <div class="form-group">
                        <label>Contact Email</label>
                        <input type="email" name="contact_email" placeholder="your@email.com">
                    </div>
                    
                    <div class="form-group">
                        <label>Contact Phone</label>
                        <input type="tel" name="contact_phone" placeholder="+254 7XX XXX XXX">
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-plus"></i> Add Property
                    </button>
                    <a href="{{ url_for('dashboard') }}" class="btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</section>

<style>
.form-section {
    padding: 120px 0 60px;
    background: #f8f9fa;
    min-height: 100vh;
}
.form-container {
    max-width: 900px;
    margin: 0 auto;
    background: white;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 2px 15px rgba(0,0,0,0.08);
}
.form-header {
    margin-bottom: 30px;
}
.back-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: #1a7f37;
    font-weight: 500;
    margin-bottom: 15px;
}
.form-header h1 {
    font-size: 1.8rem;
    color: #1a1a2e;
}
.form-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 20px;
}
.form-group {
    margin-bottom: 15px;
}
.form-group label {
    display: block;
    font-weight: 500;
    margin-bottom: 6px;
    color: #1a1a2e;
}
.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 12px 15px;
    border: 2px solid #e9ecef;
    border-radius: 8px;
    font-size: 1rem;
    transition: border-color 0.3s;
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    outline: none;
    border-color: #1a7f37;
}
.full-width {
    grid-column: span 3;
}
.file-input {
    padding: 10px;
    border: 2px dashed #e9ecef;
    border-radius: 8px;
    cursor: pointer;
}
.file-input:hover {
    border-color: #1a7f37;
}
.help-text {
    font-size: 0.85rem;
    color: #6c757d;
    margin-top: 5px;
}
.form-divider {
    border-top: 2px solid #e9ecef;
    margin: 25px 0;
    padding-top: 25px;
}
.form-divider h3 {
    color: #1a1a2e;
    font-size: 1.2rem;
}
.form-actions {
    display: flex;
    gap: 15px;
    margin-top: 30px;
}
@media (max-width: 768px) {
    .form-grid {
        grid-template-columns: 1fr;
    }
    .full-width {
        grid-column: span 1;
    }
}
</style>
{% endblock %}
